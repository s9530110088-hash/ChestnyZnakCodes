name: 1C Diagnostic EPF Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout EPF Factory
        uses: actions/checkout@v4
        with:
          repository: Pradushkoai/1c-ai-dev-env
          path: epf-factory

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./epf-factory

      - name: Build diagnostic EPF
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path("epf-factory")
          sys.path.insert(0, str(root))
          from src.services.code_generator import generate_processing
          from src.services.epf_builder import build_epf

          out = Path("build/ДиагностикаПулаКодовСУЗ")
          out.mkdir(parents=True, exist_ok=True)

          generate_processing(
              name="ДиагностикаПулаКодовСУЗ",
              synonym="Диагностика пула кодов СУЗ",
              output_dir=str(out),
              description="Безопасная диагностика метаданных 1С. Только чтение.",
          )

          obj = '''#Область ПрограммныйИнтерфейс
          Функция СведенияОВнешнейОбработке() Экспорт
              Данные = Новый Структура;
              Данные.Вставить("Наименование", "Диагностика пула кодов СУЗ");
              Данные.Вставить("БезопасныйРежим", Истина);
              Данные.Вставить("Версия", "1.0");
              Данные.Вставить("Вид", "ДополнительнаяОбработка");
              Возврат Данные;
          КонецФункции
          #КонецОбласти
          '''
          (out / "Ext" / "Module.bsl").write_text(obj, encoding="utf-8")

          src = Path("1C/ДиагностикаПулаКодовСУЗ_EPF.bsl")
          form = out / "Forms/Форма/Ext/Form/Module.bsl"
          form.parent.mkdir(parents=True, exist_ok=True)
          form.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")

          builder = root / "src/services/epf_builder.py"
          s = builder.read_text(encoding="utf-8")

          if 'files.append((f"{root_uuid}.0", module_container))' not in s:
              s = s.replace(
                  'module_container = _build_module_container(module_content)',
                  'module_container = _build_module_container(module_content)\n        files.append((f"{root_uuid}.0", module_container))',
                  1
              )

          s = s.replace(
              'form_module_content = module_path.read_bytes()',
              'form_module_content = form_module_path.read_bytes()'
          )
          builder.write_text(s, encoding="utf-8")

          result = build_epf(
              source_dir=out,
              output_path="build/ДиагностикаПулаКодовСУЗ.epf",
              object_name="ДиагностикаПулаКодовСУЗ",
              object_type="DataProcessor",
          )
          print(result)
          PY

      - name: Verify EPF
        run: |
          test -f "build/ДиагностикаПулаКодовСУЗ.epf"
          python - <<'PY'
          from pathlib import Path
          p=Path("build/ДиагностикаПулаКодовСУЗ.epf")
          d=p.read_bytes()
          print("SIZE:", len(d))
          print("SIGNATURE:", d[:4].hex())
          assert d[:4] == bytes.fromhex("ffffff7f"), "NOT A 1C EPF"
          PY

      - name: Upload EPF
        uses: actions/upload-artifact@v4
        with:
          name: 1C-ДИАГНОСТИКА-EPF
          path: build/ДиагностикаПулаКодовСУЗ.epf
          if-no-files-found: error
