name: Build PDF to CSV EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pdf_to_sul_csv/**"
      - ".github/workflows/build-pdf-to-csv.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pdf_to_sul_csv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: pdf_to_sul_csv
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ChestnyZnakPDF2CSV app.py

      - name: Verify EXE
        working-directory: pdf_to_sul_csv
        run: |
          if (!(Test-Path "dist\ChestnyZnakPDF2CSV.exe")) { throw "EXE was not created" }
          Get-Item "dist\ChestnyZnakPDF2CSV.exe" | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: ChestnyZnakPDF2CSV-Windows
          path: pdf_to_sul_csv/dist/ChestnyZnakPDF2CSV.exe
          if-no-files-found: error
