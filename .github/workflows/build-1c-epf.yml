name: Build real 1C diagnostic EPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout 1C AI dev env
        uses: actions/checkout@v4
        with:
          repository: Pradushkoai/1c-ai-dev-env
          path: epf-factory

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./epf-factory

      - name: Generate and build real EPF
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("epf-factory")
          sys.path.insert(0, str(root))

          from src.services.code_generator import generate_processing
          from src.services.epf_builder import build_epf

          out = Path("build/ДиагностикаПулаКодовСУЗ")
          out.mkdir(parents=True, exist_ok=True)

          generate_processing(
              name="ДиагностикаПулаКодовСУЗ",
              synonym="Диагностика пула кодов СУЗ",
              output_dir=str(out),
              description="Безопасная диагностика структуры регистра пула кодов СУЗ.",
          )

          object_module = r'''#Область ПрограммныйИнтерфейс

Функция СведенияОВнешнейОбработке() Экспорт

    РегистрационныеДанные = Новый Структура;
    РегистрационныеДанные.Вставить("Наименование", "Диагностика пула кодов СУЗ");
    РегистрационныеДанные.Вставить("БезопасныйРежим", Истина);
    РегистрационныеДанные.Вставить("Версия", "1.0");
    РегистрационныеДанные.Вставить("Вид", "ДополнительнаяОбработка");
    РегистрационныеДанные.Вставить("Информация", "Только чтение метаданных. Данные информационной базы не изменяются.");

    Команды = Новый ТаблицаЗначений;
    Команды.Колонки.Добавить("Идентификатор");
    Команды.Колонки.Добавить("Представление");
    Команды.Колонки.Добавить("Использование");
    Команды.Колонки.Добавить("ПоказыватьОповещение");

    Команда = Команды.Добавить();
    Команда.Идентификатор = "ОткрытьОбработку";
    Команда.Представление = "Открыть диагностику";
    Команда.Использование = "ОткрытиеФормы";
    Команда.ПоказыватьОповещение = Ложь;

    РегистрационныеДанные.Вставить("Команды", Команды);

    Возврат РегистрационныеДанные;

КонецФункции

#КонецОбласти
'''
          (out / "Ext" / "Module.bsl").write_text(object_module, encoding="utf-8")

          form_module = r'''#Область ОбработчикиСобытийФормы

&НаСервере
Процедура ПриСозданииНаСервере(Отказ, СтандартнаяОбработка)

    ДиагностикаПулаКодов();

КонецПроцедуры

#КонецОбласти

#Область СлужебныеПроцедурыИФункции

&НаСервере
Процедура ДиагностикаПулаКодов()

    Сообщить("=== ДИАГНОСТИКА ПУЛА КОДОВ СУЗ ===");
    Сообщить("Версия конфигурации: " + Метаданные.Версия);

    Найдено = Ложь;

    Для Каждого Регистр Из Метаданные.РегистрыСведений Цикл

        Имя = Регистр.Имя;
        Синоним = Регистр.Синоним;
        СтрокаПоиска = НРег(Имя + " " + Синоним);

        Если СтрНайти(СтрокаПоиска, "пул") > 0
            ИЛИ СтрНайти(СтрокаПоиска, "суз") > 0
            ИЛИ СтрНайти(СтрокаПоиска, "кодмаркиров") > 0
            ИЛИ СтрНайти(СтрокаПоиска, "маркиров") > 0 Тогда

            Найдено = Истина;

            Сообщить("");
            Сообщить("РЕГИСТР: " + Имя);
            Сообщить("Синоним: " + Синоним);

            Сообщить("-- Измерения --");
            Для Каждого Поле Из Регистр.Измерения Цикл
                Сообщить(Поле.Имя + " | " + Поле.Синоним);
            КонецЦикла;

            Сообщить("-- Ресурсы --");
            Для Каждого Поле Из Регистр.Ресурсы Цикл
                Сообщить(Поле.Имя + " | " + Поле.Синоним);
            КонецЦикла;

            Сообщить("-- Реквизиты --");
            Для Каждого Поле Из Регистр.Реквизиты Цикл
                Сообщить(Поле.Имя + " | " + Поле.Синоним);
            КонецЦикла;

        КонецЕсли;

    КонецЦикла;

    Если НЕ Найдено Тогда
        Сообщить("");
        Сообщить("Подходящий регистр не найден.");
        Сообщить("=== ВСЕ РЕГИСТРЫ СВЕДЕНИЙ ===");

        Для Каждого Регистр Из Метаданные.РегистрыСведений Цикл
            Сообщить(Регистр.Имя + " | " + Регистр.Синоним);
        КонецЦикла;
    КонецЕсли;

    Сообщить("");
    Сообщить("=== КОНЕЦ ДИАГНОСТИКИ ===");

КонецПроцедуры

#КонецОбласти
'''
          form_path = out / "Forms" / "Форма" / "Ext" / "Form" / "Module.bsl"
          form_path.write_text(form_module, encoding="utf-8")

          # Исправляем упаковщик: предыдущая версия создавала только форму,
          # а модуль объекта фактически не включала в EPF.
          builder = root / "src/services/epf_builder.py"
          s = builder.read_text(encoding="utf-8")

          old = '''    # 4c. Module of object (если есть) — UUID.0 (root UUID + .0)
    if module_content:
        module_container = _build_module_container(module_content)
        # Вставляем ПЕРЕД copyinfo (после root metadata и form)
        # Но в реальном EPF порядок: root_uuid, form_uuid, form_uuid.0, copyinfo, root, version, versions
        # Модуль объекта: root_uuid.0 — но только если есть
        # Пока пропускаем — в исходной обработке модуль объекта пустой
'''
          new = '''    # 4c. Module of object — root UUID.0
    # Этот файл критически важен для подключаемых управляемых обработок:
    # именно здесь находится экспортная функция СведенияОВнешнейОбработке().
    if module_content:
        module_container = _build_module_container(module_content)
        files.append((f"{root_uuid}.0", module_container))
'''
          if old not in s:
              raise SystemExit("Не найден участок epf_builder.py для исправления")
          s = s.replace(old, new)

          old2 = '''            form_module_content = b""
            if form_module_path.exists():
                form_module_content = module_path.read_bytes()
'''
          new2 = '''            form_module_content = b""
            if form_module_path.exists():
                form_module_content = form_module_path.read_bytes()
'''
          if old2 not in s:
              raise SystemExit("Не найден участок form module в epf_builder.py")
          s = s.replace(old2, new2)

          builder.write_text(s, encoding="utf-8")

          result = build_epf(
              source_dir=out,
              output_path="build/ДиагностикаПулаКодовСУЗ.epf",
              object_name="ДиагностикаПулаКодовСУЗ",
              object_type="DataProcessor",
          )
          print(result)
          PY

      - name: Inspect EPF
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("build/ДиагностикаПулаКодовСУЗ.epf")
          data = p.read_bytes()
          print("EPF size:", len(data))
          print("Signature:", data[:4].hex())
          if data[:4] != bytes.fromhex("ffffff7f"):
              raise SystemExit("Invalid EPF signature")
          print("OK: real EPF container created")
          PY

      - name: Upload EPF
        uses: actions/upload-artifact@v4
        with:
          name: ДиагностикаПулаКодовСУЗ_REAL
          path: build/ДиагностикаПулаКодовСУЗ.epf
