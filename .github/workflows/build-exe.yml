name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name ChestnyZnakAPI3 chestny_znak_api3.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChestnyZnakAPI3-Windows
          path: dist/ChestnyZnakAPI3.exe
